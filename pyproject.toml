[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-expert-training"
version = "1.0.0"
description = "AI 开发技术专家训练系统 - 从小白到 AI 专家的完整成长路径"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.optional-dependencies]
phase1 = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]
phase2 = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]
phase3 = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
]
phase4 = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "jupyter>=1.0",
]

[tool.setuptools]
packages = []

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
